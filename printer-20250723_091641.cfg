[idle_timeout]
  timeout: 1800
[skew_correction] 
[shaketune]
[save_variables]
  filename: /home/patrez/printer_data/.variables.stb
[exclude_object]
[gcode_arcs]
[respond]
  default_type: echo

[force_move]
enable_force_move: True
  
[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

[input_shaper]

# change T0 in the accel_chip to the tool you are currently running the tests on
[resonance_tester]
accel_chip: lis2dw CAN0
probe_points:
    175, 175, 20
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

[neopixel caselight]
pin: PB6
chain_count: 73
color_order: GRB

