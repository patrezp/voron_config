#####################################################################
#   Probe and mesh
#####################################################################

[bed_mesh]
speed: 400
horizontal_move_z: 5
mesh_min: 40, 40
mesh_max: 310,310
fade_start: 0.6
fade_end: 10.0
probe_count: 7, 7  # Values should be odd, so one point is directly at bed center
algorithm: bicubic
#relative_reference_index: 40 # Update when changing probe_count, to ((x points * y points) - 1) / 2. (the center point)
zero_reference_position: 175, 175
adaptive_margin: 5

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420

points:
   50,25
   50,275
   300,275
   300,25
speed: 500
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
