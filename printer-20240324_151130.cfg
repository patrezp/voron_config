#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.8
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 39.535
#pid_ki: 1.757
#pid_kd: 222.387

[fan_generic bed_fans]
pin: PE5
kick_start_time: 0.5

[fan_generic filter]
pin: PA2
