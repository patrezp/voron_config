[temperature_fan MCU_FAN]
sensor_type: temperature_mcu
sensor_mcu: mcu
pin: PA8
max_temp: 50.0
target_temp: 45.0
min_temp: 20.0
shutdown_speed: 0.0
kick_start_time: 0.5
cycle_time: 0.12
off_below: 0.55
max_speed: 1.0
min_speed: 0.5
control: pid
pid_Kp: 100
pid_Ki: 5
pid_Kd: 0.2

#[fan_generic MCU_FAN]
#pin: PA8
#hardware_pwm: True
#cycle_time: 0.12
#kick_start_time: 0.02


[temperature_sensor CHAMBER]
sensor_pin: PF7
sensor_type: ATC Semitec 104GT-2
max_temp: 85


[printer]
#kinematics: limited_corexy
kinematics: corexy
max_velocity: 720  
max_accel: 9000
#max_x_accel: 6700
#max_y_accel: 4000
#scale_xy_accel: True
max_z_velocity: 30          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 10.0

#####################################################################
#   Toolhead section
#####################################################################
[mcu can0]
canbus_uuid: 4f193b1faf5d

[board_pins can0]
mcu: can0
aliases:
aliases_2209:
    EXT_EN=gpio14,EXT_STEP=gpio7,EXT_DIR=gpio6,EXT_UART=gpio15,EXT_DIAG=
aliases_endstop:
    LIMIT_0=gpio20,LIMIT_1=gpio16
aliases_probe: 
    PROBE_1=gpio22,PROBE_2=gpio24
aliases_cnc_fans:
    FAN0=gpio13,FAN1=gpio21
aliases_thermistors:
    TH0=gpio27,PT100=gpio17,TC0=
aliases_heaters:
    HE0=gpio23
aliases_rgb:
    RGBLED=gpio26
#aliases_lis2dw:
#    LIS2DW=gpio12
aliases_spi:
    MOSI=gpio3,MISO=gpio4,SCK=gpio2

[temperature_sensor can0]
sensor_type: temperature_mcu
sensor_mcu: can0

## HOT END FAN
[heater_fan hotend_fan]
pin: can0:FAN1
tachometer_pin: ^can0:LIMIT_1
tachometer_ppr: 2
hardware_pwm: false
max_power: 1
tachometer_poll_interval: 0.0011
cycle_time: 0.02
off_below: 0.95
heater: extruder
heater_temp: 50.0


## PART COOLING
[fan]
pin: can0:FAN0
kick_start_time: 0.25
cycle_time: 0.010
off_below: 0.10


## EXTRUDER 
[extruder]
step_pin: can0:EXT_STEP
dir_pin: can0:EXT_DIR
enable_pin: !can0:EXT_EN
rotation_distance: 47.6413232614382
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200 #1.8deg Motor
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5
pressure_advance: 0.045
pressure_advance_smooth_time: 0.040
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: can0:HE0
sensor_type:MAX31865
sensor_pin: can0:PT100
#pullup_resistor: 1000
spi_software_mosi_pin: can0:MOSI
spi_software_miso_pin: can0:MISO
spi_software_sclk_pin: can0:SCK
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
min_extrude_temp: 0
min_temp: -50
max_temp: 350
#pid_Kp: 29.126
#pid_Ki: 1.312
#pid_Kd: 161.648

## EXTRUDER MOTOR
[tmc2209 extruder]
uart_pin: can0:EXT_UART
stealthchop_threshold: 0
run_current: 0.55
#sense_resistor: 0.110
interpolate: False
uart_address: 00

[autotune_tmc extruder]
#motor: moons-cse14hra1l410a
motor: ldo-36sth20-1004ahg
tuning_goal: performance

[lis2dw]
cs_pin: can0:gpio12
spi_software_sclk_pin: can0:SCK
spi_software_mosi_pin: can0:MOSI
spi_software_miso_pin: can0:MISO

[input_shaper]
shaper_freq_x: 54 # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
shaper_freq_y: 35.6 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.073 # damping ratio for the X axis
damping_ratio_y: 0.073 # damping ratio for the Y axis

#####################################################################
#   Probe and mesh
#####################################################################

#[probe]
#pin: !can0:PROBE_1
#x_offset: 0
#y_offset: 33.9
#z_offset: 6.42
#speed: 3
#samples:3
#samples_result: median
#sample_retract_dist: 1.5
#samples_tolerance: 0.05
#samples_tolerance_retries: 4

#[z_v2settling_probe]
#settling_sample = True

[scanner]
canbus_uuid: fde5f370497b
#adjust to suit your scanner 
x_offset: 0                          
#adjust for your offset
y_offset: 19.9                        
#adjust for your offset
calibration_method: touch
backlash_comp: 0.007564
sensor: cartographer
sensor_alt: carto
mesh_runs: 2
#scanner_touch_threshold: 1750
#alternate name to call commands. CARTO_TOUCH etc
#scanner_touch_z_offset: 0.05         
#this is the default and will be overwritten and added to the DO NOT SAVE area by using UI to save z offset

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

#[lis2dw]
#cs_pin: scanner:PA3
#spi_bus: spi1

[resonance_tester]
accel_chip: lis2dw
probe_points:
    175, 175, 20


[filament_switch_sensor SFS_T0]
switch_pin: ^PG12
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor]
switch_pin: ^PG13
detection_length: 5 # accuracy of motion sensor 2.88mm
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted

[delayed_gcode DISABLEFILAMENTSENSOR] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=SFS_T0 ENABLE=0 ; Put your filament sensor's name after SENSOR=
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

[bed_mesh]
speed: 400
horizontal_move_z: 10
mesh_min: 40, 40
mesh_max: 310,310
fade_start: 0.6
fade_end: 10.0
probe_count: 33,33 # Values should be odd, so one point is directly at bed center
algorithm: bicubic
#relative_reference_index: 40 # Update when changing probe_count, to ((x points * y points) - 1) / 2. (the center point)
zero_reference_position: 175, 175
adaptive_margin: 5



#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop #can0:LIMIT_3
position_min: 0
position_endstop: 353
position_max: 353
homing_speed: 80   #Max 100
homing_retract_dist: 0 #5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG6
#driver_SGTHRS: 255

[autotune_tmc stepper_x]
motor: moons-ms17hd6p420I-05
sg4_thrs: 140

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_y:virtual_endstop #PG6
position_min: 0
position_endstop: 362
position_max: 362
homing_speed: 80  #Max 100
homing_retract_dist: 0 #5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG9
#driver_SGTHRS: 255

[autotune_tmc stepper_y]
motor: moons-ms17hd6p420I-05
sg4_thrs: 140

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 310
position_min: -5
#position_endstop: 0.95
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[autotune_tmc stepper_z]
motor: moons-ms17hd6p420I-05

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[autotune_tmc stepper_z1]
motor: moons-ms17hd6p420I-05

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[autotune_tmc stepper_z2]
motor: moons-ms17hd6p420I-05

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[autotune_tmc stepper_z3]
motor: moons-ms17hd6p420I-05

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.8
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 39.535
#pid_ki: 1.757
#pid_kd: 222.387

[fan_generic bed_fans]
pin: PE5
kick_start_time: 0.5

[fan_generic filter]
pin: PA2
kick_start_time: 0.5

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

#[safe_z_home]
#home_xy_position: 310,310
#speed: 350
#z_hop: 10


#[homing_override]
#set_position_z: 5
#set_position_y: 10
#set_position_x: 10
