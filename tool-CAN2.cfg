[mcu can2]
canbus_uuid = f4b12aecd42f

[board_pins can2]
mcu = can2
aliases =
aliases_2209 =
        EXT_EN=gpio14,EXT_STEP=gpio7,EXT_DIR=gpio6,EXT_UART=gpio15,EXT_DIAG=
aliases_endstop =
        LIMIT_0=gpio20,LIMIT_1=gpio16
aliases_probe =
        PROBE_1=gpio22,PROBE_2=gpio24
aliases_cnc_fans =
        FAN0=gpio13,FAN1=gpio21
aliases_thermistors =
        TH0=gpio27,PT100=gpio17,TC0=
aliases_heaters =
        HE0=gpio23
aliases_rgb =
        RGBLED=gpio26
aliases_spi =
        MOSI=gpio3,MISO=gpio4,SCK=gpio2

## extruder2 
[extruder2]
step_pin: can2:EXT_STEP
dir_pin: can2:EXT_DIR
enable_pin: !can2:EXT_EN
rotation_distance: 47.6413232614382 #47.088
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200 #1.8deg Motor
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5
#pressure_advance: 0.045
#pressure_advance_smooth_time: 0.040
#########################
#####non_linear_PA stuff#
pressure_advance_model: tanh
linear_advance: 0.045528  # or 0.060 if you prefer
nonlinear_offset: 0.109
linearization_velocity: 1.5
pressure_advance_smooth_time: 0.020   # 0.015 if you want crisper transitions
pressure_advance_time_offset: 0.0019 #0.0045
########################
########################
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: can2:HE0
sensor_type:MAX31865
sensor_pin: can2:PT100
#pullup_resistor: 1000
spi_software_mosi_pin: can2:MOSI
spi_software_miso_pin: can2:MISO
spi_software_sclk_pin: can2:SCK
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
min_extrude_temp: 0
min_temp: -50
max_temp: 350
control: pid_v
pid_Kp: 28.241
pid_Ki: 2.904
pid_Kd: 68.660


## extruder2 MOTOR
[tmc2209 extruder2]
uart_pin: can2:EXT_UART
stealthchop_threshold: 0
interpolate: False
run_current: 0.6
sense_resistor: 0.110
#uart_address: 00
#driver_TBL: 1
#driver_TOFF: 3 # 41.7Khz max chopper frequency
#driver_HSTRT: 7
#driver_HEND: 7

[autotune_tmc extruder2]
motor: ldo-36sth20-1004ahg-9T
tuning_goal: silent

[temperature_sensor T2_can_board]
sensor_type = temperature_mcu
sensor_mcu = can2

[lis2dw T2]
cs_pin: can2:gpio12
spi_software_sclk_pin: can2:SCK
spi_software_mosi_pin: can2:MOSI
spi_software_miso_pin: can2:MISO
axes_map: -y,z,-x


## HOT END FAN
[heater_fan T2_hotend_fan]
pin: can2:FAN1
tachometer_pin: ^can2:LIMIT_1
tachometer_ppr: 2
hardware_pwm: false
max_power: 1
tachometer_poll_interval: 0.0009 #0.0011
cycle_time: 0.02
#off_below: 0.95
heater: extruder2
heater_temp: 50.0


## PART COOLING
[fan_generic T2_partfan]
pin: can2:FAN0
kick_start_time: 0.25
cycle_time: 0.010
#off_below: 0.10


[tool T2]
tool_number: 2
detection_pin: ^can2: PROBE_1
flip_detect: True
extruder: extruder2
fan: T2_partfan
gcode_x_offset: -0.365
gcode_y_offset: 3.575
gcode_z_offset: 0.032
params_park_x: 179.2
params_park_y: 26.1
params_park_z: 336.6
params_close_y: 58
params_safe_y: 145

#resonance_chip: lis2dw T2
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'smooth_zvd_ei'
params_input_shaper_freq_x: 50.6
params_input_shaper_damping_ratio_x: 0.061
params_input_shaper_type_y: 'smooth_mzv'
params_input_shaper_freq_y: 31.8
params_input_shaper_damping_ratio_y: 0.063


[neopixel T2_leds]
pin: can2:RGBLED
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRB
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0


[filament_switch_sensor filament_sensor_T2]
switch_pin: ^can2:LIMIT_0
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
  #SET_GCODE_VARIABLE MACRO=CAN2 VARIABLE=filament_consumed VALUE=1
insert_gcode:
  M117 Filament switch inserted
  #SET_GCODE_VARIABLE MACRO=CAN2 VARIABLE=filament_consumed VALUE=0



[delayed_gcode DISABLEFILAMENTSENSOR2] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_T2 ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro CAN2]
variable_active: 0
variable_filament_consumed: 0
variable_hotend_fan_stop_count: 0 # counter for checking if hotend fan stalled
variable_hotend_fan_min_rpm: 1500 # minimum rpm the hotend can have before fan stall is triggered
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    { action_respond_info("Please home XYZ first") }
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=CAN2 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER extruder=extruder2
    SELECT_TOOL T=2
  {% endif %}

[gcode_macro T2]
variable_realtool: "CAN2"
variable_backuptool: ""
variable_color: ""
variable_active: 0
variable_filament_consumed: 0
variable_hotend_fan_stop_count: 0 # counter for checking if hotend fan stalled
variable_hotend_fan_min_rpm: 1500 # minimum rpm the hotend can have before fan stall is triggered
gcode:
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set min_z = 0|float  %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set state = printer.print_stats.state %}
  {% set temp = printer[ex].temperature|float %}

  #G0 Z{ [cur_z+5.0, max_z]|min }
  {% if printer.toolhead.homed_axes != "xyz" %}
    { action_respond_info("Please home XYZ first") }
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=CAN2 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER extruder=extruder2
    SELECT_TOOL T=2
  {% endif %}
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
  {% if state == 'printing' and temp >= 150 %}
    CLEAN_NOZZLE_ONCE_PER_TOOL
  {% else %}
    RESPOND TYPE=echo MSG="Skip nozzle cleaning"
  {% endif %}
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_T2 ENABLE=1
