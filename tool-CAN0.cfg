[filament_motion_sensor filament_sensor_T0]
switch_pin: ^hexa:SIGNAL5
detection_length: 7 # accuracy of motion sensor 2.88mm
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder stuck
  #SET_GCODE_VARIABLE MACRO=CAN0 VARIABLE=filament_consumed VALUE=1
insert_gcode:
  M117 Filament encoder inserted
  #SET_GCODE_VARIABLE MACRO=CAN0 VARIABLE=filament_consumed VALUE=0

[delayed_gcode DISABLEFILAMENTSENSOR0] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    #SET_FILAMENT_SENSOR SENSOR=SFS_CAN0 ENABLE=0 ; Put your filament sensor's name after SENSOR=
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_T0 ENABLE=0

[gcode_macro CAN0]
variable_active: 0
variable_filament_consumed: 0
variable_hotend_fan_stop_count: 0 # counter for checking if hotend fan stalled
variable_hotend_fan_min_rpm: 1500 # minimum rpm the hotend can have before fan stall is triggered
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    { action_respond_info("Please home XYZ first") }
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=CAN0 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SELECT_TOOL T=0
  {% endif %}

[gcode_macro T0]
variable_realtool: "CAN0"
variable_backuptool: "T1"
variable_color: ""
gcode:
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set min_z = 0|float  %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set state = printer.print_stats.state %}
  {% set temp = printer[ex].temperature|float %}
  #G0 Z{ [cur_z+5.0, max_z]|min }
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
    PURGE
    CLEAN_NOZZLE
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}

  {% if state == 'printing' and temp >= 150 %}
    CLEAN_NOZZLE_ONCE_PER_TOOL
  {% else %}
    RESPOND TYPE=echo MSG="Skip nozzle cleaning"
  {% endif %}


