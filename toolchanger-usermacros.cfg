[gcode_macro M486]
gcode:
  # Parameters known to M486 are as follows:
  #   [C<flag>] Cancel the current object
  #   [P<index>] Cancel the object with the given index
  #   [S<index>] Set the index of the current object.
  #       If the object with the given index has been canceled, this will cause
  #       the firmware to skip to the next object. The value -1 is used to
  #       indicate something that isn’t an object and shouldn’t be skipped.
  #   [T<count>] Reset the state and set the number of objects
  #   [U<index>] Un-cancel the object with the given index. This command will be
  #       ignored if the object has already been skipped

  {% if 'exclude_object' not in printer %}
    {action_raise_error("[exclude_object] is not enabled")}
  {% endif %}

  {% if 'T' in params %}
    EXCLUDE_OBJECT RESET=1

    {% for i in range(params.T | int) %}
      EXCLUDE_OBJECT_DEFINE NAME={i}
    {% endfor %}
  {% endif %}

  {% if 'C' in params %}
    EXCLUDE_OBJECT CURRENT=1
  {% endif %}

  {% if 'P' in params %}
    EXCLUDE_OBJECT NAME={params.P}
  {% endif %}

  {% if 'S' in params %}
    {% if params.S == '-1' %}
      {% if printer.exclude_object.current_object %}
        EXCLUDE_OBJECT_END NAME={printer.exclude_object.current_object}
      {% endif %}
    {% else %}
      EXCLUDE_OBJECT_START NAME={params.S}
    {% endif %}
  {% endif %}

  {% if 'U' in params %}
    EXCLUDE_OBJECT RESET=1 NAME={params.U}
  {% endif %}

[gcode_macro _IF_PRINT_RETRACT]
description: Retract only if currently printing on the active tool's extruder
variable_len: 0.8       # mm
variable_f: 1200        # mm/min
variable_min_temp: 170  # fallback if extruder section has no min_extrude_temp
gcode:
  {% set ex = printer.toolhead.extruder|string %}
  {% set valid = ex in printer %}
  {% set state = printer.print_stats.state|string %}
  {% set temp = (printer[ex].temperature if valid else 0)|float %}
  {% set min_t = params.MIN_TEMP|default(min_temp)|float %}


  {% if state == 'printing' and temp >= min_t and valid %}
    SAVE_GCODE_STATE NAME=__ipr
    M83
    RESPOND TYPE=echo MSG="Retract: state={state}, tool={ex}, T={temp|round(1)}C (min {min_t|round(0)}C)"
    G1 E-{params.LEN|default(len)|float} F{params.F|default(f)|float}
    RESTORE_GCODE_STATE NAME=__ipr
  {% else %}
    RESPOND TYPE=echo MSG="Skip retract: state={state}, tool={ex}, T={temp|round(1)}C (min {min_t|round(0)}C)"
  {% endif %}


[gcode_macro _IF_PRINT_UNRETRACT]
description: Unretract only if currently printing on the active tool's extruder
variable_len: 0.8
variable_f: 1200
variable_min_temp: 170
gcode:
  {% set ex = printer.toolhead.extruder|string %}
  {% set valid = ex in printer %}
  {% set state = printer.print_stats.state|string %}
  {% set temp = (printer[ex].temperature if valid else 0)|float %}
  {% set min_t = params.MIN_TEMP|default(min_temp)|float %}

  {% if state == 'printing' and temp >= min_t and valid %}
    SAVE_GCODE_STATE NAME=__ipu
    M83
    RESPOND TYPE=echo MSG="Unretract: state={state}, tool={ex}, T={temp|round(1)}C (min {min_t|round(0)}C)"
    G1 E{params.LEN|default(len)|float} F{params.F|default(f)|float}
    RESTORE_GCODE_STATE NAME=__ipu
  {% else %}
    RESPOND TYPE=echo MSG="Skip unretract: state={state}, tool={ex}, T={temp|round(1)}C (min {min_t|round(0)}C)"
  {% endif %}

