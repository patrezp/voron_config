[gcode_macro _GLOBAL_VARS]
variable_test_val: 0
gcode:

[gcode_macro PRINT_START]
description: My complex print start macro
gcode:
  {% set TOOL = params.TOOL | default(-1)| int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(190)|float %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}
  {% set CHAMBER_TEMP = params.Chamber|default(0)|float %} ; Optional, if you have a chamber heater
  {% set test_val = params.TEST | default(0) | int %}
  {% set plate = params.PLATE|default("Textured PEI Plate") %}
  {% set sensor = printer["temperature_sensor CHAMBER"] %}

  CLEAN_NOZZLE_ONCE_RESET
  BED_MESH_CLEAR
  #STOP_CRASH_DETECTION
  
  # Start preheating bed
  M140 S40

  # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED | int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {BED_TEMP}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    M106 S255                                           # Turns on the PT-fan
    # reset timeout from whatever to 120m, allows for longer heat soak
    SET_IDLE_TIMEOUT TIMEOUT=7200
    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turns on the nevermore
    {% if sensor | int < CHAMBER_TEMP %}
      #G1 X{x_wait} Y{y_wait} Z{z_wait} F9000                    # Goes to center of the bed
      M190 S{BED_TEMP}                                  # Sets the target temp for the bed
    
      SET_DISPLAY_TEXT MSG="Heatsoak: {CHAMBER_TEMP}c"  # Displays info
      TEMPERATURE_WAIT SENSOR="temperature_sensor CHAMBER" MINIMUM={CHAMBER_TEMP}   # Waits for chamber to reach desired temp
    {% endif %}
  # reset timeout back to setting from config file
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

  {% elif params.BED | int > 59 %}
    SET_DISPLAY_TEXT MSG="Bed: {BED_TEMP}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    #G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M190 S{BED_TEMP}                                  # Sets the target temp for the bed

  # If the bed temp is not over 90c, then it skips the heatsoak and just heats up to set temp with a 5min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {BED_TEMP}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    #G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M190 S{BED_TEMP}                                  # Sets the target temp for the bed
    #SET_DISPLAY_TEXT MSG="Soak for 5min"                # Displays info
  {% endif %}

  M104 S120 T0


  M117 Homing

  M117 Quad Gantry Level
  _CG28
  {% if printer.quad_gantry_level.applied == False %}
    QUAD_GANTRY_LEVEL
  {% endif %}

  T0

  G90                            ; absolute positioning
  G1 Z20 F3000                   ; move nozzle away from bed
  M109 S170 T0 ; Wait for nozzle to reach target temp
  CLEAN_NOZZLE
  G28 Z METHOD=CONTACT CALIBRATE=1 ; calibrate z offset and beacon model hot
  BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE="adaptive" RUNS=2 ; bed mesh in scan mode
  BED_MESH_PROFILE SAVE="adaptive"
  CLEAN_NOZZLE
  G28 Z METHOD=CONTACT CALIBRATE=0    ; calibrate z offset only after QGL/mesh

  #SET_GCODE_OFFSET Z=0.04     ; add a little offset for hotend thermal expansion
                          ; needs fine tuning, long meltzones require more

  {% if TOOL >= 0 %}
    M104 T0 S0 ; shutdown T0.  If it's up first it will be heated below.
    T{params.TOOL}
    {% set initialToolTemp = 'T' ~ params.TOOL|string ~ '_TEMP' %}
    M117 Waiting on T{params.TOOL} S{params[initialToolTemp]}C
    M109 S{params[initialToolTemp]}
  {% else %}
    M109 S{TOOL_TEMP}
  {% endif %}

  #START_CRASH_DETECTION

  LINE_PURGE
  M117 Loading skew...
  SKEW_PROFILE LOAD=calilantern_skew_profile # disabled by default, uncomment to load saved skew profile


[gcode_macro PRINT_END]
description: My complex print end macro
gcode:
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float  - 10 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set cur_z = printer.toolhead.position.z|float %}

  TURN_OFF_HEATERS
  M106 S255

  {% if (cur_z + 15) <= max_z %}
    {% set safe_z = cur_z + 15 %}
  {% else %}
    {% set safe_z = max_z %}
  {% endif %}
  CLEAN_NOZZLE
  M106 S0
  T0
  #UNSELECT_TOOL
  ENCODER_DISABLE
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
  SET_SKEW CLEAR=1
  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1
  SET_VELOCITY_LIMIT ACCEL=5000
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10
  #SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE=0.045
  BED_MESH_CLEAR
  


[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro _TOOLCHANGER_CLEAN_NOZZLE]
# Machine-space brush coordinates (gantry-mounted)
variable_start_x: 22
variable_start_y: 361.5
variable_wipe_dist: 40
variable_wipe_times: 4
variable_wipe_speed: 800      # mm/min
variable_min_temp: 150
gcode:
  {% set ex = printer.toolhead.extruder %}
  {% set target = printer[ex].target|float %}
  {% set curtemp = printer[ex].temperature|float %}
  {% set min_t = params.MIN_TEMP|default(min_temp)|float %}

  # XY must be homed (Z is irrelevant for a gantry brush)
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}

  SAVE_GCODE_STATE NAME=__NOZZLE_CLEAN_STATE

  # Capture current XY gcode offsets (homing_origin is the effective gcode offset)
  {% set ox = printer.gcode_move.homing_origin.x|float %}
  {% set oy = printer.gcode_move.homing_origin.y|float %}

  # Neutralize XY offsets → use machine coordinates for the brush
  SET_GCODE_OFFSET X=0 Y=0 MOVE=0

  G90
  {% set sx = start_x|float %}
  {% set sy = start_y|float %}
  {% set dist = wipe_dist|float %}
  {% set feed = (wipe_speed|float) * 60.0 %}

  # Go to start (centered over the brush)
  G1 X{sx + dist/2.0} Y{sy} F24000

  # Heat to minimum if needed
 #{% if curtemp < min_t %}
  #  M104 S{min_t}
  #{% endif %}

  # Wipe passes
  G1 X{sx} F{feed}
  {% for i in range(wipe_times|int) %}
    G1 X{sx + dist} F{feed}
    G1 X{sx} F{feed}
  {% endfor %}

  # Move away from the brush a little
  G1 X{sx - 5} F24000

  # Restore original target temperature
  M104 S{target|int}

  RESTORE_GCODE_STATE NAME=__NOZZLE_CLEAN_STATE

# Tracks per-tool cleaning done once per print (supports up to 5 tools: extruder..extruder4)
[gcode_macro _CLEAN_ONCE_STATE]
variable_used_e0: 0
variable_used_e1: 0
variable_used_e2: 0
variable_used_e3: 0
variable_used_e4: 0
gcode:

[gcode_macro CLEAN_NOZZLE_ONCE_PER_TOOL]
description: Clean nozzle once per tool per print (uses active tool's extruder)
variable_min_temp: 150
gcode:
  {% set state = printer.print_stats.state|string %}
  {% set ex = printer.toolhead.extruder|string %}
  {% set valid = ex in printer %}
  {% set temp = (printer[ex].temperature if valid else 0)|float %}
  {% set min_t = params.MIN_TEMP|default(min_temp)|float %}
  {% if ex in printer.configfile.settings and 'min_extrude_temp' in printer.configfile.settings[ex] %}
    {% set min_t = [min_t, printer.configfile.settings[ex]['min_extrude_temp']|float]|max %}
  {% endif %}

  # map extruder -> index (extruder -> 0, extruder1 -> 1, … extruder4 -> 4)
  {% set idx = 0 %}
  {% if ex.startswith('extruder') %}
    {% set tail = ex[8:] %}
    {% if tail|length > 0 %}
      {% set idx = tail|int %}
    {% endif %}
  {% endif %}

  {% set s = printer["gcode_macro _CLEAN_ONCE_STATE"] %}
  {% set used = (s.used_e0 if idx==0
                 else s.used_e1 if idx==1
                 else s.used_e2 if idx==2
                 else s.used_e3 if idx==3
                 else s.used_e4 if idx==4
                 else 1)|int %}

  {% if state == 'printing' and valid and temp >= min_t and used == 0 %}
    RESPOND TYPE=echo MSG="CLEAN_NOZZLE (first time for {ex} this print)"
    CLEAN_NOZZLE
    {% if idx==0 %}
      SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e0 VALUE=1
    {% elif idx==1 %}
      SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e1 VALUE=1
    {% elif idx==2 %}
      SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e2 VALUE=1
    {% elif idx==3 %}
      SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e3 VALUE=1
    {% elif idx==4 %}
      SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e4 VALUE=1
    {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG="Skip CLEAN_NOZZLE (state={state}, tool={ex}, used={used}, T={temp|round(1)}C, min {min_t|round(0)}C)"
  {% endif %}

[gcode_macro CLEAN_NOZZLE_ONCE_RESET]
description: Reset once-per-tool cleaning flags
gcode:
  SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e0 VALUE=0
  SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e1 VALUE=0
  SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e2 VALUE=0
  SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e3 VALUE=0
  SET_GCODE_VARIABLE MACRO=_CLEAN_ONCE_STATE VARIABLE=used_e4 VALUE=0

