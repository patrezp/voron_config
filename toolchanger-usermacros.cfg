[gcode_macro _TOOLCHANGER_DISABLE_FILAMENT_SENSORS]
gcode:
  {% set toolnames = printer.toolchanger.tool_names %}
  {% for toolname in toolnames %}
    SET_GCODE_VARIABLE MACRO={toolname[5:]} VARIABLE=active VALUE=0
  {% endfor %}


[gcode_macro _TOOLCHANGER_PRINT_START_START]
description: Important toolchanger print_start start calls
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set z_wait = printer.toolhead.axis_maximum.z|float / 2 %}
  {% set test = params.TEST|int %}
  {% set plate = params.PLATE|default("Textured PEI Plate") %}
  {% set sensor = printer["temperature_sensor CHAMBER"] %}
  SET_GCODE_VARIABLE MACRO=_GLOBAL_VARS VARIABLE=test_val VALUE={test}
  _TOOLCHANGER_DISABLE_EXTRUDER_STEPPERS
  BED_MESH_CLEAR
  # PRIME_LINES INITIAL_TOOL={params.TOOL}

  # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    M106 S255                                           # Turns on the PT-fan
    # reset timeout from whatever to 120m, allows for longer heat soak
    SET_IDLE_TIMEOUT TIMEOUT=7200
    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turns on the nevermore
    {% if sensor|int < 52 %}
      #G1 X{x_wait} Y{y_wait} Z{z_wait} F9000                    # Goes to center of the bed
      M190 S{target_bed}                                  # Sets the target temp for the bed
    
      SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Displays info
      TEMPERATURE_WAIT SENSOR="temperature_sensor CHAMBER" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp
    {% endif %}
    # reset timeout back to setting from config file
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

  {% elif params.BED|int > 59 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    #G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M190 S{target_bed}                                  # Sets the target temp for the bed

  # If the bed temp is not over 90c, then it skips the heatsoak and just heats up to set temp with a 5min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    #G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M190 S{target_bed}                                  # Sets the target temp for the bed
    SET_DISPLAY_TEXT MSG="Soak for 5min"                # Displays info
  {% endif %}

  SETUP_KAMP_MESHING DISPLAY_PARAMETERS=1 LED_ENABLE=1 FUZZ_ENABLE=1
  SETUP_LINE_PURGE DISPLAY_PARAMETERS=1 ADAPTIVE_ENABLE=1 variable_distance_to_object_y=2

[gcode_macro _TOOLCHANGER_PRINT_START_END]
description: Important toolchanger print_start end calls
gcode:
  #Loading mesh
  {% if params.TEST|int == 1 %}       # If we are doing test, load existing mesh
    BED_MESH_PROFILE LOAD="pei_rough_PLA"
  {% elif params.TEST|int == 2 %}
    BED_MESH_CLEAR
  {% else %}
    BED_MESH_CLEAR
    BED_MESH_PROFILE LOAD="adaptive"
  {% endif %}
  M117 Loading mesh...
  #BED_MESH_PROFILE LOAD=default #disabled by default, uncomment to load saved bed_mesh profile
  {% if params.PLATE == "Cool Plate" %}
    SET_GCODE_OFFSET Z_ADJUST=0.00
  {% endif %}
  {% if params.PLATE == "Textured Cool Plate" %}
    SET_GCODE_OFFSET Z_ADJUST=0.020 MOVE=1
  {% endif %}
  {% if params.PLATE == "Engineering Plate" %}
    SET_GCODE_OFFSET Z_ADJUST=0.00
  {% endif %}
  {% if params.PLATE == "High Temp Plate" %}
    SET_GCODE_OFFSET Z_ADJUST=0.035 MOVE=1
    SET_DISPLAY_TEXT MSG="Adjusting for smooth plate"      
  {% endif %}
  {% if params.PLATE == "Textured PEI Plate" %}
    SET_GCODE_OFFSET Z_ADJUST=0.00
  {% endif %}
  
  # Heats up the nozzle up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"             # Displays info
  STATUS_HEATING                                                # Sets SB-leds to heating-mode
  G1 X10 Y362 F6000   ; park toolhead on the pad
  M107                                                          # Turns off partcooling fan
  #M109 S{target_extruder}                                       # Heats the nozzle to printing temp
  PURGE

  # Gets ready to print by doing a purge line and updating the SB-leds
  SET_DISPLAY_TEXT MSG="Printer goes printtttt!"          # Displays info
  STATUS_PRINTING                                  # Sets SB-leds to printing-mode
  G0 X5 Y5 Z25 F10000                            # Moves to starting point
  G91                                              # Incremental positioning 
  {% if params.TEST|int == 0 %}                    # If we are doing test, line purge
    LINE_PURGE 
  {% else %}                                       # Else do nothing
  {% endif %}


  G90                                              # Absolut position
  M117 Loading skew...
  SKEW_PROFILE LOAD=calilantern_skew_profile # disabled by default, uncomment to load saved skew profile


[gcode_macro _TOOLCHANGER_PRINT_END_START]
description: Important toolchanger print_end start calls
gcode:
  TURN_OFF_HEATERS
  M106 S255                      ; set part cooling to maximum

[gcode_macro _TOOLCHANGER_PRINT_END_END]
description: Important toolchanger print_end end calls
gcode:
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float  - 10 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set cur_z = printer.toolhead.position.z|float %}
  {% if (cur_z + 15) <= max_z %}
    {% set safe_z = cur_z + 15 %}
  {% else %}
    {% set safe_z = max_z %}
  {% endif %}

  #G1 X0 Y{max_y} Z{safe_z} F3000 ; bring nozzle left and bed forward
  CLEAN_NOZZLE
  SFS_DISABLE
  ENCODER_DISABLE
  STATUS_OFF
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
  SET_SKEW CLEAR=1
  SET_VELOCITY_LIMIT ACCEL=9000
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10
  SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE=0.045
  BED_MESH_CLEAR
  _TOOLCHANGER_DISABLE_EXTRUDER_STEPPERS

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=1.0  # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}

[gcode_macro CLEAN_NOZZLE_GANTRY]
gcode:
   SAVE_GCODE_STATE NAME=clean_nozzle_gantry
   G90
   G1 X21 F18000
   G1 Y362 F18000
   G1 X56 F18000
   G1 X21 F18000
   G1 X56 F18000
   G1 X10 F18000
   RESTORE_GCODE_STATE NAME=clean_nozzle_gantry

[gcode_macro PURGE]
gcode:
   SAVE_GCODE_STATE NAME=purge
   G90
   G1 X90 F18000
   G1 Y362 F18000
   {% if printer.extruder.temperature >= 210 %}
     M83      ; relative mode
     G1 E50 F600
     G1 E-10 F3000
     G92 E0   ; reset extruder
   {% endif %}
   CLEAN_NOZZLE
   
   RESTORE_GCODE_STATE NAME=purge



[gcode_macro SFS_ENABLE] ; Add this to PRINT_START
description: Enable smart filament sensor
gcode:
    M117 ENABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=SFS_CAN0 ENABLE=1 ; Put your filament sensor's name after SENSOR=

[gcode_macro SFS_DISABLE] ; Add this to PRINT_END and PRINT_CANCEL
description: Disable smart filament sensor 
gcode:
    M117 DISABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=SFS_CAN0 ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro ENCODER_ENABLE] ; Add this to PRINT_START
description: Enable SFS encoder
gcode:
    M117 ENABLING the SFS encoder
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1 ; Put your filament sensor's name after SENSOR=

[gcode_macro ENCODER_DISABLE] ; Add this to PRINT_END and PRINT_CANCEL
description: Disable SFS encoder 
gcode:
    M117 DISABLING the SFS encoder
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}


[gcode_macro PARK]
gcode:
    STATUS_IDLE
    {% set th = printer.toolhead %}
    G0 X350 Y5 Z30 F7200  
    
[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro G32]
gcode:
    #{% set TEST = printer["gcode_macro _GLOBAL_VARS"].test_val %}
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    _CG28
    CLEAN_NOZZLE
    QUAD_GANTRY_LEVEL
    G28 Z
    RESTORE_GCODE_STATE NAME=STATE_G32
    SET_DISPLAY_TEXT MSG="Bed mesh"    # Displays info
    STATUS_MESHING                     # Sets SB-leds to bed mesh-mode
    {% if printer["gcode_macro _GLOBAL_VARS"].test_val > 0 %}       # If we are doing test, load existing mesh
      BED_MESH_CLEAR
    {% else %}
      BED_MESH_CLEAR
      BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE="adaptive"               # Starts bed mesh
      BED_MESH_PROFILE SAVE="adaptive"
      BED_MESH_CLEAR
    {% endif %}

[gcode_macro heatsoak]
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=7200
    M190 S100
    SET_DISPLAY_TEXT MSG="Heatsoak: 100c"  # Displays info
    TEMPERATURE_WAIT SENSOR="temperature_sensor CANBOARD" MINIMUM=50   # Waits for chamber to reach desired temp
    # reset timeout back to setting from config file
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

[gcode_macro _SET_FAN_SPEED]
gcode:
    M106 S{ (params.PERCENT | float) * 255 / 100 }

[gcode_macro CENTER]
gcode:
    G90
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z{ printer.toolhead.axis_maximum.z/2 } F7200


[gcode_macro HEAT_SOAK]
description: heats the bed for a while

variable_target_temp: 0
variable_stage: None ## heating -> soaking -> done -> None

## in seconds
variable_check_interval: 10
variable_soak_time_remaining: 0
variable_total_time_elapsed: 0

gcode:
    {% set TARGET = params.TARGET | default(0) | float %}
    {% set DURATION = (params.DURATION | default(5) | int) * 60 %} ## minutes to seconds

    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=target_temp         VALUE={ TARGET }
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage               VALUE="'heating'"
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE={ DURATION }
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed  VALUE=0

    ;; fire up the heater
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={ TARGET }

    ;; run the fan to circulate air
    _SET_FAN_SPEED PERCENT=50

    ;; put the bed and nozzle where they're a safe distance apart
    G28
    CENTER

    M84 ;; turn off steppers

    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION={ check_interval }

[gcode_macro CANCEL_HEAT_SOAK]
description: cancels an in-progress HEAT_SOAK cycle
gcode:
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage VALUE="'cancel'"
    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION=1

[delayed_gcode heat_soaker]
; ## debug
; { action_respond_info( printer['gcode_macro HEAT_SOAK'] | tojson )}
gcode:
    {% set heat_soak = printer['gcode_macro HEAT_SOAK'] %}

    ## update total time elapsed
    {% set total_time_elapsed = heat_soak.total_time_elapsed + heat_soak.check_interval %}
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed VALUE={ total_time_elapsed }

    {% set stage = heat_soak.stage %}
    {% if stage == "heating" and printer.heater_bed.temperature >= heat_soak.target_temp %}
        {% set stage = "soaking" %}
    {% endif %}

    {% if stage == "soaking" %}
        ## update soak countdown
        {% set soak_time_remaining = [heat_soak.soak_time_remaining - heat_soak.check_interval, 0] | max %}
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE={ soak_time_remaining }

        {% if soak_time_remaining == 0 %}
            {% set stage = "done" %}
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage VALUE="'{ stage }'"

    {% if stage in ("done", "cancel") %}

        {% if stage == "cancel" %}
            {% set stage = "done" %}
            TURN_OFF_HEATERS
            M107 ; turn off fan

            M117 { "soak cancelled after ~%.1fm" | format(total_time_elapsed / 60.0) }
        {% else %}
            M117 { "soak complete after %.1fm" | format(total_time_elapsed / 60.0) }
        {% endif %}

        ## reset all state vars, except stage, which may be queried via the api
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=target_temp         VALUE=0
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE=0
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed  VALUE=0

    {% else %}

        {% if total_time_elapsed % 90 == 0 %}
            ## output status periodically
            {% if stage == "heating" %}
                M117 { "heating -- %.1fm elapsed" | format(total_time_elapsed / 60.0) }
            {% elif stage == "soaking" %}
                M117 { "soaking -- %.1fm remaining" | format(soak_time_remaining / 60.0) }
            {% endif %}
        {% endif %}

        ## trigger ourselves again
        UPDATE_DELAYED_GCODE ID=heat_soaker DURATION={ heat_soak.check_interval }

        ## dwell for 1ms to prevent from going idle
        G4 P1

    {% endif %}

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(50)|int %}                                                   ; z hop amount
    #{% set X = params.X|default(printer.toolhead.axis_maximum.x//2) %}
    #{% set Y = params.Y|default(printer.toolhead.axis_minimum.y + 10) %}
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SET_FILAMENT_SENSOR SENSOR=SFS_CAN0 ENABLE=0                                           ; disable filament sensor
        {% set pos = printer.toolhead.position %}
        {% set X = pos.x %}
        {% set Y = pos.y %}
        RESPOND TYPE=echo MSG=X{X}
        RESPOND TYPE=echo MSG=Y{Y}
        RESPOND TYPE=echo MSG=Z{pos.z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=position_x VALUE={ X }
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=position_y VALUE={ Y }
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        #G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        G1 X10 Y362 F6000   ; park toolhead on the pad
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_position_x: 0
variable_position_y: 0
gcode:
    # Parameters
    {% set e = params.E|default(0.5)|int %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=SFS_CAN0 ENABLE=1                          ; enable filament sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        RESPOND TYPE=ECHO MSG=X{position_x}Y{position_y}
        G1 X{position_x} Y{position_y}
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}

