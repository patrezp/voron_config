[neopixel caselight]
pin: PB6
chain_count: 73
color_order: GRB


[neopixel toolhead_leds]
pin: can0:RGBLED
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
#initial_WHITE: 0.0


[led_effect toolhead_logo_busy]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
    breathing  3 1 top (1,0,0,0)

[led_effect toolhead_logo_cleaning]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
    breathing  3 1 top (0.0, 0.02, 0.5)

[led_effect toolhead_logo_calibrating_z]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
        breathing  3 1 top (0.0, 0.0, 0.35)

[led_effect toolhead_logo_heating]
leds:
    neopixel:toolhead_leds (2)
autostart:                          false
frame_rate:                         24
layers:
     breathing  3 1 top (1, 0.18, 0)

[led_effect toolhead_logo_cooling]
leds:
    neopixel:toolhead_leds (2)
autostart:                          false
frame_rate:                         24
layers:
     breathing  3 1 top (0, 0, 1)

[led_effect toolhead_logo_homing]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
        breathing  3 1 top (0.0, 0.6, 0.2)

[led_effect toolhead_logo_leveling]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
        breathing  3 1 top (0.5, 0.1, 0.4)

[led_effect toolhead_logo_meshing]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
        breathing  3 1 top (0.2, 1.0, 0.0)

[led_effect toolhead_logo_printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

[led_effect toolhead_logo_standby]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
        breathing  3 1 top (0.01, 0.01, 0.01)

[led_effect toolhead_logo_part_ready]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (2)
layers:
        breathing  3 1 top (0.0, 1.0, 0.0)

####################
## nozzle effects ##
####################

[led_effect toolhead_nozzle_heating]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (1,3)
layers:
        breathing  3 1 top (1.0, 0.18, 0.0, 0.0)

[led_effect toolhead_nozzle_cooling]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (1,3)
layers:
        breathing  3 1 top (0.0, 0.0, 1.0, 0.1)

[led_effect toolhead_nozzle_standby]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (1,3)
layers:
        breathing  3 1 top (0.6, 0.0, 0.0, 0.0)

[led_effect toolhead_nozzle_part_ready]
autostart:              false
frame_rate:             24
leds:
    neopixel:toolhead_leds (1,3)
layers:
        breathing  3 1 top (0.6, 1.0, 0.0, 0.1)


#####################
## all led effects ##
#####################

[led_effect panel_idle]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight
    neopixel:toolhead_leds
layers:
    breathing  10 1 top (.5,.5,1)
    
[led_effect critical_error]
leds:
    neopixel:caselight
    neopixel:toolhead_leds
layers:
    strobe         1  1.5   add        (1.0,  1.0, 1.0)
    breathing      2  0     difference (0.95, 0.0, 0.0)
    static         1  0     top        (1.0,  0.0, 0.0)
autostart:                             false
frame_rate:                            24
run_on_error:                          true

[led_effect rainbow]
leds:
    neopixel:toolhead_leds
    neopixel:caselight
autostart:                          true
frame_rate:                         24
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.0, 0.3, 0.0),(0.0, 0.0, 0.3)




#######################
# LED Effects Statics #
#######################

[led_effect set_nozzle_leds]
leds:
    neopixel:toolhead_leds (1,3)
autostart:                          false
frame_rate:                         24
layers:
    static         1  0     top        (1.0,  1.0, 1.0, 1.0)
    
[led_effect set_caselight_leds]
leds:
    neopixel:caselight
autostart:                          false
frame_rate:                         24
layers:
    static         1  0     top        (1.0,  1.0, 1.0)

[led_effect set_logo_leds]
leds:
    neopixel:toolhead_leds (2)
autostart:                          false
frame_rate:                         24
layers:
    static         1  0     top        (1.0,  1.0, 1.0, 1.0)

##############
# The Macros #
##############

[gcode_macro set_logo_leds_off]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds STOP=1

[gcode_macro set_logo_leds_on]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds

[gcode_macro set_nozzle_leds_on]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro set_nozzle_leds_off]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds STOP=1

[gcode_macro status_off]
gcode:
    STOP_LED_EFFECTS
    SET_LED LED=toolhead_leds RED=0 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1

[gcode_macro status_ready]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=rainbow

[gcode_macro status_part_ready]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_nozzle_part_ready
    SET_LED_EFFECT EFFECT=toolhead_logo_part_ready

[gcode_macro status_busy]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_busy
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro status_heating]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_heating
    SET_LED_EFFECT EFFECT=toolhead_nozzle_heating

[gcode_macro status_cooling]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_cooling
    SET_LED_EFFECT EFFECT=toolhead_nozzle_cooling


[gcode_macro status_leveling]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_leveling
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro status_homing]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_homing
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro status_cleaning]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_cleaning
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro status_meshing]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_meshing
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro status_calibrating_z]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_logo_calibrating_z
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro status_printing]
gcode:
    STOP_LED_EFFECTS
    SET_LED LED=toolhead_leds RED=1 GREEN=1 BLUE=1 WHITE=1 TRANSMIT=1
    SET_LED_EFFECT EFFECT=set_caselight_leds