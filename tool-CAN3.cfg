[mcu can3]
canbus_uuid = 4330111c0795

[board_pins can3]
mcu = can3
aliases =
aliases_2209 =
        EXT_EN=gpio14,EXT_STEP=gpio7,EXT_DIR=gpio6,EXT_UART=gpio15,EXT_DIAG=
aliases_endstop =
        LIMIT_0=gpio20,LIMIT_1=gpio16
aliases_probe =
        PROBE_1=gpio22,PROBE_2=gpio24
aliases_cnc_fans =
        FAN0=gpio13,FAN1=gpio21
aliases_thermistors =
        TH0=gpio27,PT100=gpio17,TC0=
aliases_heaters =
        HE0=gpio23
aliases_rgb =
        RGBLED=gpio26
aliases_spi =
        MOSI=gpio3,MISO=gpio4,SCK=gpio2

## extruder3 
[extruder3]
step_pin: can3:EXT_STEP
dir_pin: !can3:EXT_DIR
enable_pin: !can3:EXT_EN
full_steps_per_rotation: 200
microsteps: 16
# BMG gearing; rotation_distance is the filament per one rev of the hob
gear_ratio: 50:10        # BMG = 50:17 (~3:1)  ← official
rotation_distance: 22.0213693923611 #22.6789  # Bondtech hob initial guess; calibrate later
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5
#pressure_advance: 0.045
#pressure_advance_smooth_time: 0.040
#########################
#####non_linear_PA stuff#
pressure_advance_model: tanh
linear_advance: 0.0375  # or 0.060 if you prefer
nonlinear_offset: 0.071 #0.109
linearization_velocity: 1.5
pressure_advance_smooth_time: 0.020   # 0.015 if you want crisper transitions
pressure_advance_time_offset: 0.0005 #0.0019 #0.0045
########################
########################
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: can3:HE0
sensor_type: ATC Semitec 104GT-2
sensor_pin: can3:TH0
min_extrude_temp: 0
min_temp: -50
max_temp: 350
control: pid_v
pid_Kp: 41.203
pid_Ki: 13.967
pid_Kd: 30.387


## extruder3 MOTOR
[tmc2209 extruder3]
uart_pin: can3:EXT_UART
stealthchop_threshold: 0
interpolate: False
run_current: 0.7
sense_resistor: 0.110
#uart_address: 00
#driver_TBL: 1
#driver_TOFF: 3 # 41.7Khz max chopper frequency
#driver_HSTRT: 7
#driver_HEND: 7

[autotune_tmc extruder3]
motor: moons-cse14hra1l410a
tuning_goal: silent

[temperature_sensor T3_can_board]
sensor_type = temperature_mcu
sensor_mcu = can3

[lis2dw T3]
cs_pin: can3:gpio12
spi_software_sclk_pin: can3:SCK
spi_software_mosi_pin: can3:MOSI
spi_software_miso_pin: can3:MISO
axes_map: -y,z,-x


## HOT END FAN
[heater_fan T3_hotend_fan]
pin: can3:FAN1
tachometer_pin: ^can3:LIMIT_1
tachometer_ppr: 2
hardware_pwm: false
max_power: 1
tachometer_poll_interval: 0.0009 #0.0011
cycle_time: 0.02
#off_below: 0.95
heater: extruder3
heater_temp: 50.0


## PART COOLING
[fan_generic T3_partfan]
pin: can3:FAN0
kick_start_time: 0.25
cycle_time: 0.010
#off_below: 0.10


[tool T3]
detection_pin: ^can3: PROBE_1
flip_detect: True
tool_number: 3
extruder: extruder3
fan: T3_partfan
gcode_x_offset: 0.710
gcode_y_offset: 1.370
gcode_z_offset: -1.641
params_park_x: 268.0
params_park_y: 25.0
params_park_z: 338.2
params_close_y: 58
params_safe_y: 145

#resonance_chip: lis2dw T3
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'smooth_zvd_ei'
params_input_shaper_freq_x: 48.4
params_input_shaper_damping_ratio_x: 0.069
params_input_shaper_type_y: 'smooth_ei'
params_input_shaper_freq_y: 31.8
params_input_shaper_damping_ratio_y: 0.122


[neopixel T3_leds]
pin: can3:RGBLED
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRB
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0


[filament_switch_sensor filament_sensor_T3]
switch_pin: ^can3:LIMIT_0
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
  #SET_GCODE_VARIABLE MACRO=CAN3 VARIABLE=filament_consumed VALUE=1
insert_gcode:
  M117 Filament switch inserted
  #SET_GCODE_VARIABLE MACRO=CAN3 VARIABLE=filament_consumed VALUE=0



[delayed_gcode DISABLEFILAMENTSENSOR3] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_T3 ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro CAN3]
variable_active: 0
variable_filament_consumed: 0
variable_hotend_fan_stop_count: 0 # counter for checking if hotend fan stalled
variable_hotend_fan_min_rpm: 1500 # minimum rpm the hotend can have before fan stall is triggered
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    { action_respond_info("Please home XYZ first") }
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=CAN3 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER extruder=extruder3
    SELECT_TOOL T=3
  {% endif %}

[gcode_macro T3]
variable_realtool: "CAN3"
variable_backuptool: ""
variable_color: ""
variable_active: 0
variable_filament_consumed: 0
variable_hotend_fan_stop_count: 0 # counter for checking if hotend fan stalled
variable_hotend_fan_min_rpm: 1500 # minimum rpm the hotend can have before fan stall is triggered
gcode:
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set min_z = 0|float  %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set state = printer.print_stats.state %}
  {% set temp = printer[ex].temperature|float %}

  #G0 Z{ [cur_z+5.0, max_z]|min }
  {% if printer.toolhead.homed_axes != "xyz" %}
    { action_respond_info("Please home XYZ first") }
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=CAN2 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER extruder=extruder2
    SELECT_TOOL T=2
  {% endif %}
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
  {% if state == 'printing' and temp >= 150 %}
    CLEAN_NOZZLE_ONCE_PER_TOOL
  {% else %}
    RESPOND TYPE=echo MSG="Skip nozzle cleaning"
  {% endif %}
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_T3 ENABLE=1