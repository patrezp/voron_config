[pa_test]
size_x: 100   # X dimension tower size  (mm)
size_y: 50    # Y dimension tower size  (mm)
height: 25 #50    # Height of tower (mm)
origin_x: 175 # Center of the bed in X
origin_y: 175 # Center of the bed in Y
layer_height: 0.25 # mm
first_layer_height: 0.3 # mm
perimeters: 1 # Number of perimeters to be printed for the tower
brim_width: 2 # Width of brim (mm)
slow_velocity:   20 # Slowest velocity for PA test segment (mm/s)
medium_velocity: 160 #80 # Medium velocity for PA test segment (mm/s)
fast_velocity:  350 #300 # End velocity for PA test segment (mm/s)
filament_diameter: 1.75
fan_speed: 1 # Fan speed applied after the brim is printed

[delayed_gcode start_pa_test]
gcode:
    {% set vars   = printer["gcode_macro RUN_PA_TEST"] %}
    {% set height = printer.configfile.settings.pa_test.height|float %}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=height_mm VALUE={height}

    ; ---- Always home/Beacon with T0 ----
    BED_MESH_CLEAR
    STOP_CRASH_DETECTION
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={vars.bed_temp}
    M190 S{vars.bed_temp}

    
    M109 S170 T0
    _CG28
    {% if printer.quad_gantry_level.applied == False %}
      QUAD_GANTRY_LEVEL
    {% endif %}
    T0
    G90
    G1 Z20 F3000
    CLEAN_NOZZLE
    
    G28 Z METHOD=CONTACT CALIBRATE=1
    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE="adaptive" RUNS=2
    BED_MESH_PROFILE SAVE="adaptive"
    CLEAN_NOZZLE
    G28 Z METHOD=CONTACT CALIBRATE=0
    M109 S{vars.hotend_temp} T{vars.tool}
    

    ; ---- Switch to requested tool for the test ----
    T{vars.tool}
    CLEAN_NOZZLE
    START_CRASH_DETECTION
    SET_GCODE_OFFSET Z_ADJUST=0.04 MOVE=1

    ; Flow override (optional)
    {% set flow_percent = vars.flow_rate|float * 100.0 %}
    {% if flow_percent > 0 %} M221 S{flow_percent} {% endif %}

    ; ---- Choose tuning parameter and record mapping ----
    {% if vars.pa_value == 0 %}
        {% if vars.testparam == 0 %}
            {% set start = 0.0 %}{% set factor = 0.001 %}{% set label = "ADVANCE" %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.001
        {% elif vars.testparam == 1 %}
            {% set start = 0.0 %}{% set factor = 0.01 %}{% set label = "OFFSET" %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=OFFSET START=0 FACTOR=.01
        {% elif vars.testparam == 2 %}
            {% set start = 0.0 %}{% set factor = 0.0001 %}{% set label = "TIME_OFFSET" %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=TIME_OFFSET START=0 FACTOR=.0001
        {% endif %}
    {% else %}
        {% set start = (vars.pa_value - vars.pa_range) if (vars.pa_value - vars.pa_range) > 0 else 0.0 %}
        {% set delta = (vars.pa_value + vars.pa_range) - start %}
        {% if vars.testparam == 0 %}
            {% set factor = delta / height %}{% set label = "ADVANCE" %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={start} FACTOR={factor}
        {% elif vars.testparam == 1 %}
            {% set factor = delta / height %}{% set label = "OFFSET" %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=OFFSET START={start} FACTOR={factor}
        {% elif vars.testparam == 2 %}
            {% set factor = delta / height %}{% set label = "TIME_OFFSET" %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=TIME_OFFSET START={start} FACTOR={factor}
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=start_val  VALUE={start}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=factor_val VALUE={factor}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=map_label  VALUE="'{label}'"
    {% set top_val = (start|float + (factor|float) * (height|float)) %}
    {action_respond_info("NPA " ~ label ~ " sweep: start=" ~ (start|float)|round(6) ~ ", factor=" ~ (factor|float)|round(6) ~ "/mm, top=" ~ (top_val|float)|round(6))}

    ; Last: queue the tower with raw params
    PRINT_PA_TOWER {vars.rawparams} FINAL_GCODE_ID=end_pa_test

    
[delayed_gcode end_pa_test]
gcode:
    M221 S100
    {% set m  = printer["gcode_macro RUN_PA_TEST"] %}
    {% set s  = m.start_val|float %}
    {% set f  = m.factor_val|float %}
    {% set H  = m.height_mm|float %}
    {% set L  = m.map_label|string %}

    {action_respond_info("NLPA " ~ L ~ " tower complete. start=" ~ s|round(6) ~
                         ", factor=" ~ f|round(6) ~ "/mm, height=" ~ H|round(2) ~ " mm")}
    {action_respond_info("How to convert: " ~ L ~ " = start + factor × h_mm")}
    {% for frac in [0, 0.25, 0.5, 0.75, 1.0] %}
      {% set h = (H*frac) %}
      {action_respond_info("  h=" ~ h|round(2) ~ " → " ~ L ~ "=" ~ (s + f*h)|round(6))}
    {% endfor %}

    ; Do NOT switch tools here — your PRINT_END restores T0
    SET_GCODE_OFFSET Z_ADJUST=-0.04 MOVE=1
    PRINT_END
    RESTORE_GCODE_STATE NAME=PA_TEST_STATE

    
[gcode_macro RUN_PA_TEST]
variable_bed_temp: -1
variable_hotend_temp: -1
variable_pa_value: 0
variable_pa_range: 0.03
variable_flow_rate: -1
variable_testparam: 0            # 0 = advance, 1 = offset, 2 = time_offset
variable_fan_speed: 0.5
variable_rawparams: ''
variable_tool: 0                 # default T0 for your homing/touch requirement
variable_map_label: ""
variable_start_val: 0.0
variable_factor_val: 0.0
variable_height_mm: 0.0
gcode:
    {% if params.NOZZLE is not defined %}{action_raise_error('NOZZLE= parameter must be provided')}{% endif %}
    {% if params.TARGET_TEMP is not defined %}{action_raise_error('TARGET_TEMP= parameter must be provided')}{% endif %}

    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=rawparams   VALUE="'{rawparams}'"
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=bed_temp    VALUE={params.BED_TEMP|default(60)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=hotend_temp VALUE={params.TARGET_TEMP}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=pa_value    VALUE={params.PA_VALUE|default(0)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=pa_range    VALUE={params.PA_RANGE|default(0.03)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=flow_rate   VALUE={params.FLOW_RATE|default(-1)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=testparam   VALUE={params.TESTPARAM|default(0)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=fan_speed   VALUE={params.FAN_SPEED|default(0.5)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=tool        VALUE={params.TOOL|default(0)|int}

    {% set h = printer.configfile.settings.pa_test.height|float %}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=height_mm   VALUE={h}

    SAVE_GCODE_STATE NAME=PA_TEST_STATE
    UPDATE_DELAYED_GCODE ID=start_pa_test DURATION=0.01

#####################################################################
# NLPA — STEP 1: ADVANCE (linear_advance) sweep
#####################################################################
[gcode_macro NPA_ADV]
description: NLPA step 1 — ADVANCE tower (TESTPARAM=0), prints HELP if no params
gcode:
  {% set show = params.HELP|default(0)|int == 1 or (rawparams|string)|length == 0 %}
  {% if show %}
    RESPOND PREFIX="NPA" MSG="NPA_ADV — ADVANCE tower (TESTPARAM=0)"
    RESPOND PREFIX="NPA" MSG="Params:"
    RESPOND PREFIX="NPA" MSG="  TOOL=n            (optional; default current tool)"
    RESPOND PREFIX="NPA" MSG="  NOZZLE=0.4        (example)"
    RESPOND PREFIX="NPA" MSG="  TARGET_TEMP=225    BED_TEMP=60"
    RESPOND PREFIX="NPA" MSG="  FLOW=0.92         (optional; M221 S92)"
    RESPOND PREFIX="NPA" MSG="  A=center R=range  (A=0 and R=0 => full sweep)"
    RESPOND PREFIX="NPA" MSG="  V=1.5             (optional linearization velocity)"
    RESPOND PREFIX="NPA" MSG="Conversion: ADVANCE = start + factor * height_mm"
    RESPOND PREFIX="NPA" MSG="Examples:"
    RESPOND PREFIX="NPA" MSG="  NPA_ADV NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 A=0 R=0"
    RESPOND PREFIX="NPA" MSG="  NPA_ADV TOOL=1 NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 A=0.048 R=0.01"
  {% else %}
    {% set nozzle = params.NOZZLE|default(0.4)|float %}
    {% set ht    = params.TARGET_TEMP|default(225)|float %}
    {% set bed   = params.BED_TEMP|default(60)|float %}
    {% set flow  = params.FLOW|default(-1)|float %}
    {% set a_ctr = params.A|default(0.0)|float %}
    {% set a_rng = params.R|default(0.01)|float %}
    {% set vel   = params.V|default(1.5)|float %}
    {% set tool  = params.TOOL|default(-1)|int %}

    SET_PRESSURE_ADVANCE ADVANCE={params.BASELINE_ADV|default(0.0)|float} OFFSET=0 TIME_OFFSET=0 VELOCITY={vel}
    RUN_PA_TEST TOOL={tool} NOZZLE={nozzle} TARGET_TEMP={ht} BED_TEMP={bed} TESTPARAM=0 PA_VALUE={a_ctr} PA_RANGE={a_rng} FLOW_RATE={flow}
  {% endif %}




#####################################################################
# NLPA — STEP 2: OFFSET (nonlinear_offset) sweep
#####################################################################
[gcode_macro NPA_OFFSET]
description: NLPA step 2 — OFFSET tower (TESTPARAM=1), prints HELP if no params
gcode:
  {% set show = params.HELP|default(0)|int == 1 or (rawparams|string)|length == 0 %}
  {% if show %}
    RESPOND PREFIX="NPA" MSG="NPA_OFFSET — OFFSET tower (TESTPARAM=1)"
    RESPOND PREFIX="NPA" MSG="Params:"
    RESPOND PREFIX="NPA" MSG="  TOOL=n"
    RESPOND PREFIX="NPA" MSG="  NOZZLE=0.4  TARGET_TEMP=225  BED_TEMP=60"
    RESPOND PREFIX="NPA" MSG="  FLOW=0.92   (optional)"
    RESPOND PREFIX="NPA" MSG="  ADV=0.060   (baseline ADVANCE; default reads [extruder])"
    RESPOND PREFIX="NPA" MSG="  O=center R=range  (O=0 and R=0 => full sweep)"
    RESPOND PREFIX="NPA" MSG="  V=1.5       (optional)"
    RESPOND PREFIX="NPA" MSG="Conversion: OFFSET = start + factor * height_mm"
    RESPOND PREFIX="NPA" MSG="Example:"
    RESPOND PREFIX="NPA" MSG="  NPA_OFFSET NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 ADV=0.060 O=0.13 R=0.03"
  {% else %}
    {% set nozzle = params.NOZZLE|default(0.4)|float %}
    {% set ht    = params.TARGET_TEMP|default(225)|float %}
    {% set bed   = params.BED_TEMP|default(60)|float %}
    {% set flow  = params.FLOW|default(-1)|float %}
    {% set o_ctr = params.O|default(0.05)|float %}
    {% set o_rng = params.R|default(0.025)|float %}
    {% set vel   = params.V|default(1.5)|float %}
    {% set tool  = params.TOOL|default(-1)|int %}
    {% set adv_base = params.ADV|default(printer.configfile.settings.extruder.linear_advance|default(0.0))|float %}

    SET_PRESSURE_ADVANCE ADVANCE={adv_base} OFFSET=0 TIME_OFFSET=0 VELOCITY={vel}
    RUN_PA_TEST TOOL={tool} NOZZLE={nozzle} TARGET_TEMP={ht} BED_TEMP={bed} TESTPARAM=1 PA_VALUE={o_ctr} PA_RANGE={o_rng} FLOW_RATE={flow}
  {% endif %}




#####################################################################
# NLPA — STEP 3: TIME (pressure_advance_time_offset) sweep
#####################################################################
[gcode_macro NPA_TIME]
description: NLPA step 3 — TIME_OFFSET tower (TESTPARAM=2), prints HELP if no params
gcode:
  {% set show = params.HELP|default(0)|int == 1 or (rawparams|string)|length == 0 %}
  {% if show %}
    RESPOND PREFIX="NPA" MSG="NPA_TIME — TIME_OFFSET tower (TESTPARAM=2)"
    RESPOND PREFIX="NPA" MSG="Params:"
    RESPOND PREFIX="NPA" MSG="  TOOL=n"
    RESPOND PREFIX="NPA" MSG="  NOZZLE=0.4  TARGET_TEMP=225  BED_TEMP=60"
    RESPOND PREFIX="NPA" MSG="  FLOW=0.92   (optional)"
    RESPOND PREFIX="NPA" MSG="  ADV=0.060   OFF=0.120   (baselines during test)"
    RESPOND PREFIX="NPA" MSG="  TO=center R=range  (e.g., TO=0.0005 R=0.0005 => 0..0.001 s)"
    RESPOND PREFIX="NPA" MSG="  V=1.5       (optional)"
    RESPOND PREFIX="NPA" MSG="Conversion: TIME_OFFSET = start + factor * height_mm  (seconds)"
    RESPOND PREFIX="NPA" MSG="Example:"
    RESPOND PREFIX="NPA" MSG="  NPA_TIME NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 ADV=0.060 OFF=0.120 TO=0.0005 R=0.0005"
  {% else %}
    {% set nozzle = params.NOZZLE|default(0.4)|float %}
    {% set ht    = params.TARGET_TEMP|default(225)|float %}
    {% set bed   = params.BED_TEMP|default(60)|float %}
    {% set flow  = params.FLOW|default(-1)|float %}
    {% set t_ctr = params.TO|default(0.006)|float %}
    {% set t_rng = params.R|default(0.0005)|float %}
    {% set vel   = params.V|default(1.5)|float %}
    {% set tool  = params.TOOL|default(-1)|int %}
    {% set adv_base = params.ADV|default(printer.configfile.settings.extruder.linear_advance|default(0.0))|float %}
    {% set off_base = params.OFF|default(printer.configfile.settings.extruder.nonlinear_offset|default(0.0))|float %}

    SET_PRESSURE_ADVANCE ADVANCE={adv_base} OFFSET={off_base} TIME_OFFSET=0 VELOCITY={vel}
    RUN_PA_TEST TOOL={tool} NOZZLE={nozzle} TARGET_TEMP={ht} BED_TEMP={bed} TESTPARAM=2 PA_VALUE={t_ctr} PA_RANGE={t_rng} FLOW_RATE={flow}
  {% endif %}


[gcode_macro NPA_CONVERT]
description: Convert a measured tower height to the NLPA value
gcode:
  {% if params.H is not defined %}
    {action_respond_info("NPA_CONVERT usage:")}
    {action_respond_info("  NPA_CONVERT H=<height_mm>")}
    {action_respond_info("Uses last tower mapping: value = start + factor * height_mm")}
  {% else %}
    {% set h = params.H|float %}
    {% set m = printer["gcode_macro RUN_PA_TEST"] %}
    {% set s = m.start_val|float %}
    {% set f = m.factor_val|float %}
    {% set L = (m.map_label|string) %}
    {% set name = L if L else "VALUE" %}
    {% set v = s + f*h %}
    {action_respond_info("At height " ~ h|round(2) ~ " mm -> " ~ name ~ " = " ~ v|round(6))}
  {% endif %}



#####################################################################
# NLPA TEST BUTTONS — HOW TO USE (for NPA_ADV / NPA_OFFSET / NPA_TIME)
#
# What these wrappers do
# ----------------------
# - NPA_ADV   : prints a tuning tower for linear_advance (ADVANCE) → TESTPARAM=0
# - NPA_OFFSET: prints a tuning tower for nonlinear_offset (OFFSET) → TESTPARAM=1
# - NPA_TIME  : prints a tuning tower for pressure_advance_time_offset (TIME_OFFSET) → TESTPARAM=2
#
# Each wrapper:
#   • heats bed/nozzle, runs your calibrated homing/leveling (always with T0),
#   • switches to the requested tool (TOOL=…) for the actual print,
#   • launches a single valid TUNING_TOWER,
#   • prints a helper note in the console at the end explaining how to read the tower,
#   • resets flow (M221 S100) and calls PRINT_END (your PRINT_END restores T0).
#
# Reading any tower
# -----------------
# After the print finishes you’ll see:
#   NLPA <LABEL> tower complete. start=<S>, factor=<F>/mm, height=<H> mm
#   How to convert: <LABEL> = start + factor × h_mm
#   h=0 → …
#   h=H/4 → …
#   …
#
# The conversion is always:            value = START + FACTOR × height_mm
# (Use the table printed in the console, or run: NPA_CONVERT H=<mm>)
#
# Defaults for FULL-RANGE sweeps (when you do not pass PA_VALUE):
#   ADVANCE       : start=0.000, factor=0.001   per mm  → 0.000–0.050 over 50 mm (or scaled to your height)
#   OFFSET        : start=0.000, factor=0.010   per mm  → 0.000–0.500 over 50 mm
#   TIME_OFFSET   : start=0.000, factor=0.0001  per mm  → 0.000–0.005 s over 50 mm
#
# When you pass PA_VALUE=<center> and PA_RANGE=<range>, the macro computes:
#   start = max(center - range, 0)
#   factor = (center + range - start) / tower_height_mm
#
# What to look for
# ----------------
# Judge a face away from the seam. Towers have 3 speed bands (slow/med/fast) per layer.
# - ADVANCE too low  : bulge before boundary, thin after; puffy corners.
# - ADVANCE too high : notch before boundary, bulge after; starved corners.
# - OFFSET too low   : fast band looks under-extruded/striated vs slow band.
# - OFFSET too high  : fast band pebbly/over-extruded; zits/comb texture.
# - TIME_OFFSET low  : ridge/lag appears after the boundary.
# - TIME_OFFSET high : ridge leads before the boundary; fast band gets pebbly.
# - Best             : band widths and texture match; boundary least visible.
#
# Typical direct-drive landing zones (guidance, not rules)
#   ADVANCE: 0.02–0.07
#   OFFSET : 0.08–0.18
#   TIME   : 0.000–0.003 s
# Keep linearization_velocity ~1.5 and smooth_time 0.020 (0.015 if you want crisper transitions).
#
# Toolchanger specifics
# ---------------------
# - Homing/Beacon is always done with T0 (macro enforces this).
# - The tower prints with TOOL=<n> if you pass it; otherwise current tool.
# - PRINT_END restores T0 (by your design), so end_pa_test does not change tools.
#
# Flow, temps, and consistency
# ----------------------------
# - Keep FLOW fixed across all towers for a given filament; you can override with:
#     … FLOW=<ratio>   e.g., FLOW=0.92   (the macro issues M221 S92)
# - Use the same filament temperature you actually print with.
# - If you change [pa_test].height or velocities, do RESTART before the next run.
#
# Quick workflow (per toolhead/nozzle, with a reference PLA)
# ----------------------------------------------------------
# 1) ADVANCE (wide)  : NPA_ADV   NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 A=0 R=0
#    → pick mm height → set ADVANCE.
# 2) OFFSET (narrow) : NPA_OFFSET NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 ADV=<adv> O=0.13 R=0.03
#    → pick mm height → set OFFSET.
# 3) TIME (narrow)   : NPA_TIME  NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 ADV=<adv> OFF=<off> TO=0.0005 R=0.0005
#    → pick mm height → set TIME_OFFSET.
#
# Mainsail Favorites (examples; add TOOL=… if needed)
# ---------------------------------------------------
#  - NPA_ADV   NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 A=0.048 R=0.010
#  - NPA_OFFSET NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 ADV=0.060 O=0.13 R=0.03
#  - NPA_TIME  NOZZLE=0.4 TARGET_TEMP=225 BED_TEMP=60 FLOW=0.92 ADV=0.060 OFF=0.120 TO=0.0005 R=0.0005
#
# Troubleshooting
# ---------------
# - Heaters cool immediately: PRINT_PA_TOWER finished at once → ensure RUN_PA_TEST keeps rawparams
#   and FINAL_GCODE_ID name matches [delayed_gcode end_pa_test].
# - “Ending tuning test mode” mid-start: only one TUNING_TOWER is allowed at a time.
# - No visual change on TIME tower: your best value is near 0.000–0.001 s; set ~0.0005 and validate on a small print.
# - After changing [pa_test].height or speeds, use RESTART so helper math and tower planning match.
#
# On-demand conversion helper
# ---------------------------
#  - After any tower, you can compute the exact value at a measured mark:
#      NPA_CONVERT H=<mm>
#    It uses the last tower’s (start, factor, label) captured by the macros.
#####################################################################

