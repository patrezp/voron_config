[mcu can1]
canbus_uuid = c88f68705551

[board_pins can1]
mcu = can1
aliases =
aliases_2209 =
        EXT_EN=gpio14,EXT_STEP=gpio7,EXT_DIR=gpio6,EXT_UART=gpio15,EXT_DIAG=
aliases_endstop =
        LIMIT_0=gpio20,LIMIT_1=gpio16
aliases_probe =
        PROBE_1=gpio22,PROBE_2=gpio24
aliases_cnc_fans =
        FAN0=gpio13,FAN1=gpio21
aliases_thermistors =
        TH0=gpio27,PT100=gpio17,TC0=
aliases_heaters =
        HE0=gpio23
aliases_rgb =
        RGBLED=gpio26
aliases_spi =
        MOSI=gpio3,MISO=gpio4,SCK=gpio2

## extruder1 
[extruder1]
step_pin: can1:EXT_STEP
dir_pin: can1:EXT_DIR
enable_pin: !can1:EXT_EN
rotation_distance: 47.6413232614382 #47.088
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200 #1.8deg Motor
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5
pressure_advance: 0.045
pressure_advance_smooth_time: 0.040
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: can1:HE0
sensor_type:MAX31865
sensor_pin: can1:PT100
#pullup_resistor: 1000
spi_software_mosi_pin: can1:MOSI
spi_software_miso_pin: can1:MISO
spi_software_sclk_pin: can1:SCK
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
min_extrude_temp: 0
min_temp: -50
max_temp: 350
control: pid
pid_Kp: 29.422
pid_Ki: 2.581
pid_Kd: 83.851


## extruder1 MOTOR
[tmc2209 extruder1]
uart_pin: can1:EXT_UART
stealthchop_threshold: 0
interpolate: False
run_current: 0.6
sense_resistor: 0.110
#uart_address: 00
#driver_TBL: 1
#driver_TOFF: 3 # 41.7Khz max chopper frequency
#driver_HSTRT: 7
#driver_HEND: 7

[autotune_tmc extruder1]
motor: ldo-36sth20-1004ahg-9T
tuning_goal: silent

[temperature_sensor CAN1_can_board]
sensor_type = temperature_mcu
sensor_mcu = can1

[lis2dw CAN1]
cs_pin: can1:gpio12
spi_software_sclk_pin: can1:SCK
spi_software_mosi_pin: can1:MOSI
spi_software_miso_pin: can1:MISO
axes_map: -y,z,-x

#[input_shaper]
#shaper_freq_x: 55.2 # center frequency for the X axis filter
#shaper_type_x: mzv # filter type for the X axis
#shaper_freq_y: 37 # center frequency for the Y axis filter
#shaper_type_y: mzv # filter type for the Y axis
#damping_ratio_x: 0.085 # damping ratio for the X axis
#damping_ratio_y: 0.055 # damping ratio for the Y axis


## HOT END FAN
[heater_fan CAN1_hotend_fan]
pin: can1:FAN1
tachometer_pin: ^can1:LIMIT_1
tachometer_ppr: 2
hardware_pwm: false
max_power: 1
tachometer_poll_interval: 0.0009 #0.0011
cycle_time: 0.02
off_below: 0.95
heater: extruder1
heater_temp: 50.0

## PART COOLING
[fan_generic CAN1_partfan]
pin: can1:FAN0
kick_start_time: 0.25
cycle_time: 0.010
off_below: 0.10


[tool CAN1]
detection_pin: ^can1:PROBE_1
tool_number: 1
extruder: extruder1
fan: fan_generic CAN1_partfan
gcode_x_offset: -0.300
gcode_y_offset: -0.920
gcode_z_offset: -0.109 #-0.074 #-0.099 #-0.025 #0.23 #0.190 #0.142 #0.111 #0.195
params_park_x: 91.2
params_park_y: 25.2
params_park_z: 337.5
params_close_y: 58
params_safe_y: 145
#resonance_chip: lis2dw CAN1
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 49.6
params_input_shaper_damping_ratio_x: 0.077
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 29.4
params_input_shaper_damping_ratio_y: 0.072

#[tool_probe T1]
#pin: ^can1:PROBE_1
#tool: 1
#x_offset: 0
#y_offset: 0
#z_offset: -1.216 #-1.4 #-0.63
#speed: 10
#lift_speed: 20
#drop_first_result: True
#samples:3
#samples_result: median
#sample_retract_dist: 2
#samples_tolerance: 0.02
#samples_tolerance_retries: 3
#activate_gcode:
#    _TAP_PROBE_ACTIVATE HEATER=extruder1

[filament_switch_sensor filament_sensor_T1]
switch_pin: ^can1:LIMIT_0
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
  #SET_GCODE_VARIABLE MACRO=CAN1 VARIABLE=filament_consumed VALUE=1
insert_gcode:
  M117 Filament switch inserted
  #SET_GCODE_VARIABLE MACRO=CAN1 VARIABLE=filament_consumed VALUE=0



[delayed_gcode DISABLEFILAMENTSENSOR1] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_T1 ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro CAN1]
variable_active: 0
variable_filament_consumed: 0
variable_hotend_fan_stop_count: 0 # counter for checking if hotend fan stalled
variable_hotend_fan_min_rpm: 1500 # minimum rpm the hotend can have before fan stall is triggered
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    { action_respond_info("Please home XYZ first") }
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=CAN1 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER extruder=extruder1
    SELECT_TOOL T=1
  {% endif %}

[gcode_macro T1]
variable_realtool: "CAN1"
variable_backuptool: ""
variable_color: ""
gcode:
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}\
  {% set min_z = 0|float  %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set state = printer.print_stats.state %}
  {% set temp = printer[ex].temperature|float %}

  #G0 Z{ [cur_z+5.0, max_z]|min }
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
  {% if state == 'printing' and temp >= 150 %}
    CLEAN_NOZZLE_ONCE_PER_TOOL
  {% else %}
    RESPOND TYPE=echo MSG="Skip nozzle cleaning"
  {% endif %}

