[include mcu.cfg]
[include mcu-hexa.cfg]
[include mcu-beacon.cfg]
[include kinematics.cfg]
[include motion.cfg]
#[include homing.cfg]
[include bed_mesh.cfg]
[include heaters_and_fans.cfg]
[include mainsail_local.cfg]
[include KAMP_Settings.cfg]
[include config_backup.cfg]
[include midi.conf]
[include timelapse.cfg]
[include toolchanger-includes.cfg]
[include non_linear_pa.cfg]

[danger_options]
allow_plugin_override: True

[virtual_sdcard]
path: ~/printer_data/gcodes

[idle_timeout]
  timeout: 1800
  
[skew_correction] 

[shaketune]

[save_variables]
  filename: /home/patrez/printer_data/.variables.stb
  
[exclude_object]

[gcode_arcs]

[respond]
  default_type: echo

[force_move]
enable_force_move: True

[input_shaper]
enabled_extruders: extruder, extruder1, extruder2, extruder3, extruder4


# change T0 in the accel_chip to the tool you are currently running the tests on
[resonance_tester]
accel_chips: beacon, adxl345 T0, lis2dw T1, lis2dw T2, lis2dw T3, lis2dw T4 #CAN0
probe_points:
    175, 175, 20
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

[axiscope]
pin: PG10              # Endstop pin
zswitch_x_pos: 235     # REQUIRED - X position of the endstop switch
zswitch_y_pos: 355.500    # REQUIRED - Y position of the endstop switch
zswitch_z_pos: 10        # REQUIRED - Z position of the endstop switch
lift_z: 1                 # OPTIONAL - Amount to lift Z before moving (default: 1)
move_speed: 60            # OPTIONAL - XY movement speed in mm/s (default: 60)
z_move_speed: 10          # OPTIONAL - Z movement speed in mm/s (default: 10)

[neopixel caselightBL]
pin: hexa:SIGNAL1 #PB6 
chain_count: 36
color_order: GRB

[neopixel caselightR]
pin: hexa:SIGNAL2 #PB6 
chain_count: 18
color_order: GRB

[neopixel caselightF]
pin: hexa:SIGNAL3 #PB6 
chain_count: 18
color_order: GRB


[sensorless_auto_tune]

[quad_gantry_offsets]
tilt: 6
safe_z: 2

[gcode_macro TEST_AXIS]
gcode:
    {% macro move(axis, pos) -%}
        RESPOND MSG="moving to -> {axis}={pos}"
        QGO_SLOPED_G0 {axis}={pos}
        M400
        PRINT_Z
    {%- endmacro %}

    G0 X175 Y175 Z20
    QGO_TILT_GANTRY X=10
    G0 X175 Y175 Z20
    {move('X', 100)}
    {move('X', 250)}
    {move('X', 175)}
    {move('Y', 100)}
    {move('Y', 250)}
    {move('Y', 175)}
    QGO_TILT_GANTRY Y=10
    G0 X175 Y175 Z20
    {move('X', 100)}
    {move('X', 250)}
    {move('X', 175)}
    {move('Y', 100)}
    {move('Y', 250)}
    {move('Y', 175)}
    QGO_TILT_GANTRY
    G0 X175 Y175 Z20

[gcode_macro PRINT_Z]
gcode:
    {% set pos = printer.toolhead.position %}
    RESPOND MSG="z: {pos[2]}"

