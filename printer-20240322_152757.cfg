#[include Voron2_Octopus_Config.cfg]
#[include sb_leds.cfg]
[include leds.cfg]
[include KAMP/*cfg]
[include macros.cfg]
#[include flexplate.cfg]
[include config_backup.cfg]
#[include reshelper.cfg]
#[include IS_shaper_calibrate.cfg]
#[include IS_vibrations_measurement.cfg]
[include K-ShakeTune/*.cfg]
[include nozzle_scrub.cfg]
[include homing.cfg]

[save_variables]
    filename: /home/patrez/printer_data/.variables.stb

[exclude_object]

[gcode_arcs]

[respond]
default_type: echo
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "!! "
#default_prefix: echo:
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".

[force_move]
enable_force_move: True

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mpu9250]
i2c_mcu: rpi
i2c_bus: i2c.1

#[resonance_tester]
#accel_chip: mpu9250
#probe_points:
#    175, 175, 100  # an example

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_250030001750344D30353320-if00
canbus_uuid: 1fc2bb30fb5b
#restart_method: command
##--------------------------------------------------------------------

